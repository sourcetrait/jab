# The shims: what the SDK's tool puts between QEMU and the host, one
# crate each under crates/, built into the jab target's shim/:
# libraries preloaded into QEMU with LD_PRELOAD, and the pad bridge,
# a binary run beside it. A crate declares only its name and
# description; everything else is the workspace's.
[workspace]
resolver = "3"
members = [
    "crates/sdl",
    "crates/evdev",
    "crates/pad",
]

[workspace.package]
version = "0.0.0-1"
edition = "2024"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/lowkick"
homepage = "https://sourcetrait.com"
publish = false

[workspace.dependencies]
gilrs = "0.11"
