[workspace]
resolver = "3"
members = [
    "crates/lib",
    "crates/cli",
]

[workspace.package]
version = "0.0.0-1"
edition = "2024"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/lowkick"
homepage = "https://sourcetrait.com"

[workspace.dependencies]
lowkickdisco = { path = "crates/lib" }
cpal = { version = "0.18", features = ["pulseaudio"] }
gilrs = "0.11"
