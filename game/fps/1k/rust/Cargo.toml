# Jab FPS's host tools, one crate each under the workspace: what
# outgrows nushell. A crate declares only its name and description;
# everything else is the workspace's.
[workspace]
resolver = "3"
members = [
    "svg2png",
]

[workspace.package]
version = "0.0.0-1"
edition = "2024"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/lowkick"
homepage = "https://sourcetrait.com"
publish = false

[workspace.dependencies]
resvg = "0.48"
